<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生物专项练习 - 七年级上册第一章 认识生物</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', Arial, sans-serif;
               background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
               min-height: 100vh; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; background: white;
                     border-radius: 15px; padding: 30px;
                     box-shadow: 0 10px 40px rgba(0,0,0,0.2); }
        h1 { color: #333; margin-bottom: 10px; }
        .subtitle { color: #666; margin-bottom: 30px; }
        .progress-text { font-size: 16px; color: #666; margin-bottom: 10px; }
        .progress-bar { width: 100%; height: 8px; background: #e0e0e0;
                        border-radius: 4px; overflow: hidden; margin-bottom: 30px; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #4caf50, #8bc34a);
                         width: 0%; transition: width 0.3s ease; }
        .question-card { background: #f8f9fa; border-radius: 10px; padding: 25px; margin-bottom: 20px; }
        .question-text { font-size: 18px; color: #333; margin-bottom: 20px; line-height: 1.6; }
        .diagram-container { background: white; border: 2px dashed #ddd;
                             border-radius: 10px; padding: 20px; margin: 20px 0;
                             text-align: center; }
        .diagram-container svg { max-width: 100%; height: auto; }
        .options { display: grid; gap: 12px; margin: 20px 0; }
        .option { padding: 15px 20px; background: white; border: 2px solid #e0e0e0;
                  border-radius: 8px; cursor: pointer; transition: all 0.2s ease;
                  font-size: 16px; }
        .option:hover { border-color: #4caf50; background: #f1f8e9; }
        .option.selected { border-color: #4caf50; background: #4caf50; color: white; }
        .option.correct { border-color: #4caf50; background: #4caf50; color: white; }
        .option.incorrect { border-color: #f44336; background: #f44336; color: white; }
        .btn { padding: 12px 30px; background: linear-gradient(135deg, #4caf50 0%, #8bc34a 100%);
               color: white; border: none; border-radius: 8px; font-size: 16px;
               cursor: pointer; transition: transform 0.2s ease; }
        .btn:hover { transform: translateY(-2px); }
        .btn:disabled { background: #ccc; cursor: not-allowed; transform: none; }
        .hint-box { background: #fff3e0; border-left: 4px solid #ff9800;
                    padding: 15px; margin: 20px 0; border-radius: 5px;
                    cursor: pointer; }
        .feedback-box { background: #e8f5e9; border-left: 4px solid #4caf50;
                        padding: 20px; margin: 20px 0; border-radius: 5px; display: none; }
        .knowledge-card { background: #e8f5e9; border: 2px solid #4caf50;
                          padding: 20px; margin: 20px 0; border-radius: 10px; display: none; }
        .knowledge-card h3 { color: #2e7d32; margin-bottom: 15px; }
        .knowledge-item { margin: 10px 0; padding: 10px; background: white;
                          border-radius: 5px; }
        .result-screen { text-align: center; padding: 40px 20px; }
        .score-display { font-size: 48px; color: #4caf50; margin: 30px 0; font-weight: bold; }
        .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin: 30px 0; }
        .stat-item { background: #f8f9fa; padding: 20px; border-radius: 10px; }
        .stat-number { font-size: 32px; color: #4caf50; font-weight: bold; }
        .stat-label { color: #666; margin-top: 5px; }
        .difficulty { display: inline-block; padding: 5px 12px; background: #ff9800;
                      color: white; border-radius: 15px; font-size: 14px; margin-left: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔬 生物专项练习 - 认识生物</h1>
        <p class="subtitle">七年级上册第一章 · 全面覆盖所有知识点</p>

            <div class="progress-text">
                第 <span id="current-q">1</span> 题 / 共 15 题
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
            <div id="questions-container"></div>
            <button class="btn" id="submit-btn" onclick="submitAnswer()" style="margin-top: 15px;" disabled>提交答案</button>
            <button class="btn" id="next-btn" onclick="nextQuestion()" style="margin-top: 15px; margin-left: 10px;" disabled>下一题</button>
        </div>
        <div id="result-screen" class="result-screen" style="display: none;">
            <h2>🎉 练习完成！</h2>
            <div class="score-display">得分：<span id="final-score">0</span>/150</div>
            <div class="stats">
                <div class="stat-item">
                    <div class="stat-number" id="correct-count">0</div>
                    <div class="stat-label">正确题数</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="accuracy">0%</div>
                    <div class="stat-label">准确率</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="time-taken">0</div>
                    <div class="stat-label">用时 (秒)</div>
                </div>
            </div>
            <div id="syncStatus" style="margin:16px 0;padding:12px;border-radius:10px;display:none;text-align:center;">
                <span id="syncText"></span>
            </div>
            <button class="btn" onclick="location.reload()">重新练习</button>
        </div>
    </div>

                options: ["分类等级越大，共同特征越多", "分类等级越小，包含的生物种类越多", "分类等级越小，共同特征越多", "分类等级大小与共同特征无关"],
                correct: 2,
                feedback: "分类等级越小（如种），包含的生物种类越少，但共同特征越多，亲缘关系越近。分类等级越大（如界），包含种类越多，但共同特征越少。",
                knowledge: "分类等级规律：等级越大→种类越多→共同特征越少→亲缘关系越远；等级越小→种类越少→共同特征越多→亲缘关系越近。"
            },
            {
                number: 13,
                type: "选择题",
                difficulty: "★★☆",
                text: "下列哪项不是调查时应注意的事项？",
                hint: ["💡 提示 1：调查要注意安全", "💡 提示 2：要如实记录", "💡 提示 3：不能破坏生物的生活环境"],
                options: ["注意安全", "如实记录", "可以随意采集生物标本", "不破坏生物的生活环境"],
                correct: 2,
                feedback: "'可以随意采集生物标本'错误。调查时不能随意采集生物标本，更不能破坏生物的生活环境。",
                knowledge: "调查注意事项：①注意安全；②如实记录；③不破坏环境；④不随意采集标本；⑤范围大时可抽样；⑥不凭个人喜好取舍。"
            },
            {
                number: 14,
                type: "选择题",
                difficulty: "★★★",
                text: "在'探究光对鼠妇分布的影响'实验中，下列做法正确的是：",
                hint: ["💡 提示 1：这是对照实验", "💡 提示 2：变量只能有一个（光照）", "💡 提示 3：其他条件都应相同"],
                options: ["只用 1 只鼠妇做实验", "实验装置一侧明亮一侧阴暗", "实验过程中可以移动鼠妇", "实验一次就可以得出结论"],
                correct: 1,
                feedback: "正确做法是实验装置一侧明亮一侧阴暗，形成对照。A 错误，应用多只鼠妇减少误差；C 错误，不能移动鼠妇；D 错误，应重复实验取平均值。",
                knowledge: "对照实验设计原则：①单一变量原则（只有光照不同）；②对照原则（明亮和阴暗对照）；③重复原则（多只鼠妇、多次实验）；④其他条件都相同。"
            },
            {
                number: 15,
                type: "选择题",
                difficulty: "★★☆",
                text: "下列属于生物对环境适应的是：",
                hint: ["💡 提示 1：生物适应环境的表现", "💡 提示 2：保护色、拟态等都是适应", "💡 提示 3：仙人掌的叶变成刺是适应干旱"],
                options: ["仙人掌的叶变成刺", "大树底下好乘凉", "蚯蚓疏松土壤", "植物能净化空气"],
                correct: 0,
                feedback: "仙人掌的叶变成刺是为了减少水分散失，适应干旱环境。B、C、D 都是生物影响环境，不是生物适应环境。",
                knowledge: "生物与环境的关系：①生物适应环境（如：仙人掌叶变刺、保护色、拟态）；②生物影响环境（如：蚯蚓松土、植物净化空气）；③环境影响生物。"
            }
        ];

        let currentQuestion = 0;
        let score = 0;
        let selectedOption = null;
        let startTime = Date.now();
        let wrongList = [];
        let hintLevel = 0;

        function renderQuestion() {
            const q = questions[currentQuestion];
            const container = document.getElementById('questions-container');
            
            let optionsHTML = '';
            if (q.type === '选择题' || q.type === '判断题') {
                optionsHTML = `<div class="options">
                    ${q.options.map((opt, idx) => 
                        `<div class="option" onclick="selectOption(${idx})">${String.fromCharCode(65 + idx)}. ${opt}</div>`
                    ).join('')}
                </div>`;
            } else if (q.type === '填空题') {
                optionsHTML = `<div style="margin: 20px 0;">
                    <input type="text" id="fill-answer" placeholder="请输入答案" 
                           style="padding: 12px; font-size: 16px; width: 300px; border: 2px solid #ddd; border-radius: 8px;"
                           oninput="enableSubmitForFill()">
                </div>`;
            }

            container.innerHTML = `
                <div class="question-card">
                    <div style="margin-bottom: 15px;">
                        <span style="background: #4caf50; color: white; padding: 5px 12px; border-radius: 15px; font-size: 14px;">${q.type}</span>
                        <span class="difficulty">难度：${q.difficulty}</span>
                    </div>
                    <div class="question-text">
                        <strong>第${q.number}题：</strong>${q.text}
                    </div>
                    ${q.diagram ? `<div class="diagram-container">${q.diagram}</div>` : ''}
                    ${optionsHTML}
                    <div class="hint-box" onclick="toggleHint(this)" id="hint-box">
                        💡 点击查看提示（0/3）
                    </div>
                    <button class="btn" id="submit-btn" onclick="submitAnswer()" style="margin-top: 15px;" disabled>提交答案</button>
                    <button class="btn" id="next-btn" onclick="nextQuestion()" style="margin-top: 15px; margin-left: 10px;" disabled>下一题</button>
                    <div class="feedback-box" id="feedback">
                        <strong>✅ 解析：</strong>${q.feedback}
                    </div>
                    <div class="knowledge-card" id="knowledge">
                        <h3>📚 知识点卡片</h3>
                        <div class="knowledge-item">
                            <strong>📖 核心知识点：</strong><br>${q.knowledge}
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('current-q').textContent = currentQuestion + 1;
            document.getElementById('progress-fill').style.width = ((currentQuestion + 1) / questions.length * 100) + '%';
        }

        function toggleHint(el) {
            const q = questions[currentQuestion];
            hintLevel++;
            if (hintLevel > 3) hintLevel = 3;
            
            if (Array.isArray(q.hint) && q.hint.length >= hintLevel) {
                el.textContent = q.hint[hintLevel - 1] + `（${hintLevel}/3）`;
            } else if (typeof q.hint === 'string') {
                el.textContent = q.hint + `（${hintLevel}/3）`;
            }
            el.style.cursor = 'default';
        }

        function selectOption(idx) {
            if (document.querySelector('.option.correct')) return;
            
            selectedOption = idx;
            const options = document.querySelectorAll('.option');
            options.forEach((opt, i) => {
                opt.classList.remove('selected');
                if (i === idx) opt.classList.add('selected');
            });
            
            document.getElementById('submit-btn').disabled = false;
        }

        function enableSubmitForFill() {
            const input = document.getElementById('fill-answer');
            const submitBtn = document.getElementById('submit-btn');
            if (input && input.value.trim() !== '') {
                submitBtn.disabled = false;
            } else {
                submitBtn.disabled = true;
            }
        }

        function submitAnswer() {
            const q = questions[currentQuestion];
            
            if (q.type === '选择题' || q.type === '判断题') {
                if (selectedOption === null) {
                    alert('请先选择一个答案！');
                    return;
                }
                
                const options = document.querySelectorAll('.option');
                const isCorrect = selectedOption === q.correct;
                
                if (isCorrect) {
                    score += 10;
                    options[selectedOption].classList.add('correct');
                } else {
                    options[selectedOption].classList.add('incorrect');
                    options[q.correct].classList.add('correct');
                    wrongList.push({
                        number: q.number,
                        text: q.text,
                        correctAnswer: q.options[q.correct]
                    });
                }
                
                options.forEach(opt => opt.style.cursor = 'default');
                showFeedback(isCorrect);
                
                document.getElementById('submit-btn').disabled = true;
                document.getElementById('next-btn').disabled = false;
            }
            else if (q.type === '填空题') {
                const input = document.getElementById('fill-answer');
                const answer = input.value.trim();
                
                if (!answer) {
                    alert('请输入答案！');
                    return;
                }
                
                const isCorrect = answer === '科' || answer === '水圈';
                
                if (isCorrect) {
                    score += 10;
                    input.style.borderColor = '#4caf50';
                    input.style.backgroundColor = '#e8f5e9';
                } else {
                    input.style.borderColor = '#f44336';
                    input.style.backgroundColor = '#ffebee';
                    wrongList.push({
                        number: q.number,
                        text: q.text,
                        correctAnswer: q.number === 4 ? '科' : '水圈'
                    });
                }
                
                showFeedback(isCorrect);
                document.getElementById('submit-btn').disabled = true;
                document.getElementById('next-btn').disabled = false;
            }
        }

        function showFeedback(isCorrect) {
            const feedbackBox = document.getElementById('feedback');
            const knowledgeBox = document.getElementById('knowledge');
            
            feedbackBox.style.display = 'block';
            knowledgeBox.style.display = 'block';
            
            if (isCorrect === false) {
                wrongList.push({
                    number: questions[currentQuestion].number,
                    text: questions[currentQuestion].text,
                    correctAnswer: questions[currentQuestion].options ? 
                        questions[currentQuestion].options[questions[currentQuestion].correct] : 
                        (questions[currentQuestion].number === 4 ? '科' : '水圈')
                });
            }
        }

        function nextQuestion() {
            currentQuestion++;
            hintLevel = 0;
            if (currentQuestion < questions.length) {
                selectedOption = null;
                document.getElementById('submit-btn').disabled = true;
                document.getElementById('next-btn').disabled = true;
                const fillInput = document.getElementById('fill-answer');
                if (fillInput) {
                    fillInput.value = '';
                    fillInput.style.borderColor = '#ddd';
                    fillInput.style.backgroundColor = 'white';
                }
                renderQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            document.getElementById('quiz-screen').style.display = 'none';
            document.getElementById('result-screen').style.display = 'block';
            
            const endTime = Date.now();
            const timeTaken = Math.floor((endTime - startTime) / 1000);
            
            document.getElementById('final-score').textContent = score;
            document.getElementById('correct-count').textContent = Math.round(score / 10);
            document.getElementById('accuracy').textContent = Math.round((score / (questions.length * 10)) * 100) + '%';
            document.getElementById('time-taken').textContent = timeTaken;

            if (typeof FeishuSync !== 'undefined') {
                FeishuSync.submit({
                    practiceTitle: document.title,
                    questionCount: questions.length,
                    score: score / 10,
                    accuracy: Math.round((score / (questions.length * 10)) * 100),
                    practiceUrl: location.href,
                    statusElId: 'syncStatus',
                    textElId: 'syncText'
                });
                
                if (wrongList.length > 0) {
                    FeishuSync.submitWrongQuestions({
                        practiceTitle: document.title,
                        practiceUrl: location.href,
                        subject: '生物',
                        wrongQuestions: wrongList
                    });
                }
            }
        }

        renderQuestion();
    </script>
</body>
</html>
